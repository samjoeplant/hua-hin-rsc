<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location | Hua Hin Rangers Supporters Club</title>

<body>

<div id="header"></div>

<section>
  <h2>Our Location</h2>
  <p>We are based in Hua Hin, Thailand, and our supporters club meets at the Traveller's Rest Sports Bar.</p>
  <p>The venue houses a 4 metre screen where locals and visitors can meet to watch Rangers games.   </p>
</section>

<section>
  <h3>Club Location Details</h3>
  <div class="location-layout">

        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen>
      </iframe>
    </div>
    <div class="location-details">
      <h4>Address</h4>
      <p>The Traveller's Rest Sports Bar<br>
      Soi 94, Hua Hin<br>
      Thailand</p>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="layout.js"></script>

</html>
